<script>
let currentLang='en';
const i18n={strong_buy:{en:'STRONG BUY',zh:''},buy:{en:'BUY',zh:''},weak_buy:{en:'WEAK BUY',zh:''},hold:{en:'HOLD',zh:''},weak_sell:{en:'WEAK SELL',zh:''},sell:{en:'SELL',zh:''},strong_sell:{en:'STRONG SELL',zh:''},long:{en:'LONG',zh:''},short:{en:'SHORT',zh:''},uptrend:{en:'Uptrend',zh:''},downtrend:{en:'Downtrend',zh:''},sideways:{en:'Sideways',zh:''},loading:{en:'Loading...',zh:'...'},price:{en:'Price',zh:''},score:{en:'Score',zh:''},signal:{en:'Signal',zh:''},trend:{en:'Trend',zh:''},online:{en:'Online',zh:''},offline:{en:'Offline (Demo)',zh:''}};
function t(k){var e=i18n[k];return e?e[currentLang]||e.en||k:k}
function setLang(l){currentLang=l;document.getElementById('langEN').classList.toggle('active',l==='en');document.getElementById('langZH').classList.toggle('active',l==='zh');refreshDashboard()}
function switchTab(tb){document.querySelectorAll('.nav-tab').forEach(function(e){e.classList.remove('active')});document.querySelector('[data-tab="'+tb+'"]').classList.add('active');document.querySelectorAll('[id^="tab-"]').forEach(function(e){e.classList.add('hidden')});document.getElementById('tab-'+tb).classList.remove('hidden');if(tb==='dashboard')refreshDashboard();else if(tb==='analyze')runAnalysis();else if(tb==='contract')runContractAnalysis();else if(tb==='plan')initPlanTab()}
const CRYPTO_LIST=['BTC','ETH','SOL','BNB','XRP','DOGE','ADA','AVAX','DOT','LINK','MATIC','UNI','ATOM','LTC'];
const CG_IDS={BTC:'bitcoin',ETH:'ethereum',SOL:'solana',BNB:'binancecoin',XRP:'ripple',DOGE:'dogecoin',ADA:'cardano',AVAX:'avalanche-2',DOT:'polkadot',LINK:'chainlink',MATIC:'matic-network',UNI:'uniswap',ATOM:'cosmos',LTC:'litecoin'};
const DEMO_PRICES={BTC:87000,ETH:3200,SOL:145,BNB:610,XRP:0.52,DOGE:0.12,ADA:0.45,AVAX:35,DOT:7.5,LINK:15,MATIC:0.75,UNI:8.5,ATOM:9,LTC:80};
let networkOnline=false;function safePlot(id,data,layout,opts){try{if(typeof Plotly!=="undefined")Plotly.newPlot(id,data,layout,opts)}catch(e){console.warn("Plotly:",e)}}function debug(m){console.log(m);var el=document.getElementById("debugInfo");if(el)el.innerHTML=(el.innerHTML?el.innerHTML+"<br>":"")+new Date().toLocaleTimeString()+": "+m}
function sr(s){var x=Math.sin(s)*43758.5453;return x-Math.floor(x)}
function fetchWithTimeout(url,ms){ms=ms||3000;var c=new AbortController();var t=setTimeout(function(){c.abort()},ms);return fetch(url,{signal:c.signal}).then(function(r){clearTimeout(t);return r}).catch(function(e){clearTimeout(t);throw e})}
async function fetchBinancePrice(s){try{var r=await fetchWithTimeout('https://api.binance.com/api/v3/ticker/24hr?symbol='+s+'USDT');var d=await r.json();if(d.lastPrice)return{price:parseFloat(d.lastPrice),change_pct:parseFloat(d.priceChangePercent),name:s,currency:'USDT',source:'binance'}}catch(e){}return null}
async function fetchCoinGeckoPrices(syms){try{var ids=syms.map(function(s){return CG_IDS[s]||''}).filter(Boolean).join(',');if(!ids)return{};var r=await fetchWithTimeout('https://api.coingecko.com/api/v3/simple/price?ids='+ids+'&vs_currencies=usd&include_24hr_change=true');var d=await r.json();var res={};syms.forEach(function(s){var c=CG_IDS[s];if(c&&d[c]){res[s]={price:d[c].usd,change_pct:d[c].usd_24h_change||0,name:s,currency:'USD',source:'coingecko'}}});return res}catch(e){return{}}
}
function getDemoPrice(s){if(DEMO_PRICES[s]){var seed=Math.floor(Date.now()/60000)+s.charCodeAt(0)*100;var r=sr(seed);var p=DEMO_PRICES[s]*(1+(r-0.5)*0.06);return{price:Math.round(p*100)/100,change_pct:Math.round((r-0.5)*6*100)/100,name:s,currency:'USDT',source:'demo'}}return null}
async function getPrice(s){var sym=s.toUpperCase();var r=await fetchBinancePrice(sym);if(r&&r.price>0){networkOnline=true;return r}var cg=await fetchCoinGeckoPrices([sym]);if(cg[sym]&&cg[sym].price>0){networkOnline=true;return cg[sym]}return getDemoPrice(sym)}
async function batchPrices(syms){var res={};try{var sstr=JSON.stringify(syms.map(function(s){return s+'USDT'}));var r=await fetchWithTimeout('https://api.binance.com/api/v3/ticker/24hr?symbols='+encodeURIComponent(sstr));var d=await r.json();if(Array.isArray(d)){networkOnline=true;d.forEach(function(i){var sym=i.symbol.replace('USDT','');res[sym]={price:parseFloat(i.lastPrice),change_pct:parseFloat(i.priceChangePercent),name:sym,currency:'USDT',source:'binance'}});for(var i=0;i<syms.length;i++){if(!res[syms[i]]){var pr=await getPrice(syms[i]);if(pr)res[syms[i]]=pr}}return res}}catch(e){}var cgRes=await fetchCoinGeckoPrices(syms);for(var i=0;i<syms.length;i++){var s=syms[i];if(cgRes[s]){res[s]=cgRes[s];networkOnline=true}else{var dp=getDemoPrice(s);if(dp)res[s]=dp}}return res}

function ema(d,p){var k=2/(p+1);var r=new Array(d.length);r[0]=d[0];for(var i=1;i<d.length;i++)r[i]=d[i]*k+r[i-1]*(1-k);return r};function sma(d,p){var r=new Array(d.length);for(var i=0;i<d.length;i++){if(i<p-1){var s=0;for(var j=0;j<=i;j++)s+=d[j];r[i]=s/(i+1)}else{var s=0;for(var j=i-p+1;j<=i;j++)s+=d[j];r[i]=s/p}}return r};function analyzeMACD(kl){var cl=kl.map(function(k){return k.close});var e12=ema(cl,12);var e26=ema(cl,26);var dif=e12.map(function(v,i){return v-e26[i]});var dea=ema(dif,9);var hist=dif.map(function(v,i){return (v-dea[i])*2});var l=cl.length-1;var c=dif[l],p=dea[l];var h=hist[l],hp=hist[l-1]||h;var golden=dif[l-1]<=dea[l-1]&&c>p;var dead=dif[l-1]>=dea[l-1]&&c<p;var trend=c>p?"bullish":"bearish";var div=null;if(cl.length>=20){var rc=cl.slice(-20);var rd=dif.slice(-20);var mxC=Math.max.apply(null,rc);var mnC=Math.min.apply(null,rc);var mxD=Math.max.apply(null,rd);var mnD=Math.min.apply(null,rd);if(rc[19]>=mxC&&rd[19]<mxD*0.9)div="bearish";else if(rc[19]<=mnC&&rd[19]>mnD*1.1)div="bullish"}var st=50;var dt=[];if(golden){st+=30;dt.push({factor:"golden_cross",impact:30,desc_en:"MACD golden cross",desc_zh:"MACD"})}if(dead){st-=30;dt.push({factor:"dead_cross",impact:-30,desc_en:"MACD dead cross",desc_zh:"MACD"})}if(h>0&&h>hp){st+=15;dt.push({factor:"hist_rising",impact:15,desc_en:"Histogram rising",desc_zh:""})}if(h<0&&h<hp){st-=15;dt.push({factor:"hist_falling",impact:-15,desc_en:"Histogram falling",desc_zh:""})}if(div==="bullish"){st+=20;dt.push({factor:"bull_div",impact:20,desc_en:"Bullish divergence",desc_zh:" MACD"})}if(div==="bearish"){st-=20;dt.push({factor:"bear_div",impact:-20,desc_en:"Bearish divergence",desc_zh:" MACD"})}if(c>0&&p>0){st+=5;dt.push({factor:"positive_zone",impact:5,desc_en:"Above zero line",desc_zh:"DIFDEA"})}if(c<0&&p<0){st-=5;dt.push({factor:"negative_zone",impact:-5,desc_en:"Below zero line",desc_zh:"DIFDEA"})}if(!dt.length)dt.push({factor:"neutral",impact:0,desc_en:"No strong signal",desc_zh:"MACD"});st=Math.max(0,Math.min
